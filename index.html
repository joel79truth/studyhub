<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App icon in browser -->

    <!-- PWA settings – now using .webmanifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Mobile app colors -->
    <meta name="theme-color" content="#024927" />
    <meta name="color-scheme" content="light" />

    <!-- PWA: Android + Chrome install eligibility -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: iOS Safari "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="StudyHub" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7MKTE9Z1SD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Configure GA4 (SPA route changes handled dynamically in React)
      gtag('config', 'G-7MKTE9Z1SD', {
        send_page_view: false
      });
    </script>

    <title>StudyHub</title>
  </head>
